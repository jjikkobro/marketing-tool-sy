name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 공개 안전 (이전 직장 명칭 유출 검사)
        run: npm run check:leaks

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # 브라우저 자동화 테스트(가상 피드 v1→v2→v3)는 실제 Chromium이 있어야 건너뛰지 않는다
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: 데모 실행 (키 없이 실패 시나리오 재현)
        run: npm run demo:fail

      - run: npm run build

  # 라이브 데모 이미지가 실제로 빌드되고 뜨는지 확인한다 (로컬에 Docker가 없어 CI에서 검증)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t social-collector .
      - name: 컨테이너 기동과 화면·API 응답 확인
        run: |
          docker run -d --name app -p 10000:10000 social-collector
          for i in $(seq 1 60); do curl -fsS http://localhost:10000/api/health && break; sleep 2; done
          curl -fsS http://localhost:10000/ | grep -q '<div id="root">'
          curl -fsS -c jar http://localhost:10000/api/live | grep -q '"proposals"'
          docker logs app
